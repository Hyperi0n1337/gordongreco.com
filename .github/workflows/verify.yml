name: Verify website and portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify public website
        run: bash build.sh
      - name: Install portal and test dependencies
        run: python -m pip install --disable-pip-version-check -e 'portal[dev]'
      - name: Verify portal
        working-directory: portal
        run: python scripts/verify.py --no-write
