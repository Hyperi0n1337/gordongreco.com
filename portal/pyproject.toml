[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gordon-greco-secure-portal"
version = "0.4.2"
description = "Invitation-only Gordon Greco client portal and non-executing treasury workflow"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.18",
  "cryptography==46.0.4",
  "fastapi==0.128.2",
  "psycopg[binary,pool]==3.2.10",
  "python-magic==0.4.27",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
include = ["portal_core*", "portal_adapters*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["packages", "apps/api", "apps/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
