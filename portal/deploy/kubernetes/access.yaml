apiVersion: v1
kind: ServiceAccount
metadata: {name: portal-api, namespace: gg-portal}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: portal-worker, namespace: gg-portal}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: gg-portal}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress-egress, namespace: gg-portal}
spec:
  podSelector: {matchLabels: {app: portal-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-egress, namespace: gg-portal}
spec:
  podSelector: {matchLabels: {app: portal-worker}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 3310}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
