limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 9m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  root /srv/public;
  location / {
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io" always;
  }

  location = /portal { return 308 /portal/; }
  location /portal/ {
    alias /srv/portal/;
    try_files $uri $uri/ /portal/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'none'" always;
  }
  location = /portal/sw.js { return 404; }

  location /api/v1/auth/magic-link {
    limit_req zone=auth_limit burst=3 nodelay;
    proxy_pass http://api:8080/v1/auth/magic-link;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location /api/ {
    proxy_pass http://api:8080/;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
